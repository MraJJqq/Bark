name: bark-push

on:
  repository_dispatch:
    types: [vegas-signals]
  schedule:
    # Re-registered schedule: Beijing time 08:30 / 10:30 / 16:30 / 20:30 / 22:30
    - cron: "30 0,2,8,12,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Single writer for Bark delivery and state. Never cancel an active delivery.
concurrency:
  group: bark-single-writer
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load latest persisted delivery state
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:state.json > state.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record trigger and Vegas event status
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          VEGAS_STATUS: ${{ github.event.client_payload.scanner_job_status }}
        run: |
          set -euo pipefail
          echo "EVENT_NAME=$EVENT_NAME"
          echo "SCHEDULE_CRON=${SCHEDULE_CRON:-not-a-schedule-event}"
          echo "VEGAS_STATUS=${VEGAS_STATUS:-not-a-repository-dispatch}"
          echo "RUN_ID=$GITHUB_RUN_ID"
          echo "RUN_STARTED_UTC=$(date -u +%FT%TZ)"
          echo "RUN_STARTED_BEIJING=$(TZ=Asia/Shanghai date +%FT%T%z)"
      - name: Install dependency
        run: pip install requests
      - name: Run Bark notifier
        env:
          SCANNER_REPO: MraJJqq/vegas
          SCANNER_TOKEN: ${{ secrets.SCANNER_TOKEN }}
          SCANNER_WORKFLOW: vegas-scan.yml
          SCANNER_BRANCH: main
          BARK_KEY: ${{ secrets.BARK_KEY || secrets.BARK_DEVICE_KEY }}
          BARK_SERVER: https://api.day.app
        run: python bark.py
      - name: Save delivery state
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f state.json ]; then
            echo "state.json not created; nothing to persist"
            exit 0
          fi

          git config user.name "bark-bot"
          git config user.email "bark-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Delivery state unchanged"
            exit 0
          fi
          git commit -m "Update Bark delivery state"

          # Retry non-fast-forward races. If state.json conflicts during
          # rebase, merge its records instead of choosing either side.
          for attempt in 1 2 3 4 5; do
            echo "Persist attempt ${attempt}/5"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Delivery state persisted"
                exit 0
              fi
              echo "Push raced with another update; retrying"
              continue
            fi

            if git diff --name-only --diff-filter=U | grep -qx 'state.json'; then
              echo "Merging concurrent state.json updates"
              python - <<'PY'
          import json
          import subprocess

          def stage(number):
              raw = subprocess.check_output(
                  ["git", "show", f":{number}:state.json"], text=True
              )
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise SystemExit("Conflicted state is not a JSON object")
              return value

          ours, theirs = stage(2), stage(3)
          merged = dict(theirs)
          merged.update(ours)

          for field in ("sent", "uncertain", "uncertain_alerts"):
              combined = {}
              for source in (theirs.get(field, {}), ours.get(field, {})):
                  if not isinstance(source, dict):
                      raise SystemExit(f"Malformed {field} during merge")
                  for key, value in source.items():
                      old = combined.get(key)
                      old_ts = old.get("ts", 0) if isinstance(old, dict) else 0
                      new_ts = value.get("ts", 0) if isinstance(value, dict) else 0
                      if old is None or new_ts >= old_ts:
                          combined[key] = value
              merged[field] = combined

          # Cross-day carryover is disabled; never resurrect an older pending queue.
          merged["pending_signals"] = {}

          # Keep the newest day's cumulative signal set; union concurrent updates
          # only when both writers belong to that same Beijing calendar day.
          daily_dates = [
              value for value in (theirs.get("daily_date"), ours.get("daily_date"))
              if isinstance(value, str)
          ]
          if daily_dates:
              newest_day = max(daily_dates)
              daily_signals = {}
              for source in (theirs, ours):
                  if source.get("daily_date") == newest_day:
                      values = source.get("daily_signals", {})
                      if not isinstance(values, dict):
                          raise SystemExit("Malformed daily_signals during merge")
                      daily_signals.update(values)
              merged["daily_date"] = newest_day
              merged["daily_signals"] = daily_signals
          else:
              merged["daily_date"] = None
              merged["daily_signals"] = {}

          # A confirmed send wins over an uncertain marker for the same ID.
          for key in merged["sent"]:
              merged["uncertain"].pop(key, None)

          for field in ("no_signal_slots", "failure_slots"):
              values = []
              for source in (theirs.get(field, []), ours.get(field, [])):
                  if not isinstance(source, list):
                      raise SystemExit(f"Malformed {field} during merge")
                  for value in source:
                      if value not in values:
                          values.append(value)
              merged[field] = values

          merged["initialized"] = bool(
              ours.get("initialized") or theirs.get("initialized")
          )
          for field in ("baseline_generated_at",):
              values = [v for v in (theirs.get(field), ours.get(field)) if v]
              if values:
                  merged[field] = max(values)

          with open("state.json", "w", encoding="utf-8") as handle:
              json.dump(merged, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY
              git add state.json
              GIT_EDITOR=true git rebase --continue
            else
              echo "Rebase conflict outside state.json; refusing automatic resolution" >&2
              git rebase --abort || true
              exit 1
            fi
          done

          echo "Failed to persist state.json after 5 attempts" >&2
          exit 1
